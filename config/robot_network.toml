[network]
# 基础控制工控机。qmlinker、相机和夹爪服务连接该地址。
base_control_ip = "192.168.100.60"

# Orin 模组固定地址。用于平板直连时的接入探测。
orin_ip = "192.168.100.50"

# 大寰夹爪服务端口。
gripper_port = 50066

[qmlinker]
host = "192.168.100.60"
port = 50062
data_port = 50061
default_speed_ratio = 0.3
request_timeout_s = 3.0
stream_first_timeout_s = 2.0

[hand.left]
spec = "hand_3"

[hand.right]
spec = "hand_3"
