openapi: 3.1.0
info:
  title: RecordReplay HTTP API
  version: 3.9.0
  description: >-
    双臂记录回放服务 HTTP API。POST /start 可能控制真实设备，必须由现场人员确认安全后调用。
    状态 WebSocket 通过 API Gateway 的 /api/v1/record-replay-ws 提供 WSS 入口。
servers:
  - url: http://{host}:6300
    variables:
      host:
        default: 192.168.1.128
externalDocs:
  description: 完整中文接口说明与安全边界
  url: ./API%20Reference.md
paths:
  /health:
    get:
      operationId: get_health
      summary: 读取服务健康信息和版本
      description: 不连接现场设备，仅返回 RecordReplay 版本、API 主版本和当前服务状态。
      responses:
        '200':
          description: 服务健康信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayHealthResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /status:
    get:
      operationId: get_status
      summary: 读取回放状态
      responses:
        '200':
          description: 状态快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /config:
    get:
      operationId: get_config
      summary: 读取运行参数
      responses:
        '200':
          description: 状态和完整运行参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: update_config
      summary: 更新运行参数
      description: 回放线程运行期间拒绝修改；动作顺序、speed 和 zone 由 idle 时读取的 action_sequence.json 承载，托盘 index 由每次 plan/start 请求传入。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigChanges'
      responses:
        '200':
          description: 保存后的完整参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /plan:
    get:
      operationId: get_plan
      summary: 启动前读取回放计划
      description: >-
        只在 idle 且没有活动回放线程时读取并校验 action_sequence.json 与实际 CSV；不连接
        现场设备、不创建执行线程、不允许通过该接口修改 speed、zone 或 index。
      parameters:
        - name: old_tray_current_index
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: 本次旧托盘当前位置 index，绑定 get_tray。
        - name: old_tray_put_index
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: 本次旧托盘放置位置 index，绑定 put_tray。
        - name: new_tray_current_index
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: 本次新托盘当前位置 index，绑定 get_new_tray。
        - name: new_tray_put_index
          in: query
          required: true
          schema: {type: integer, minimum: 1}
          description: 本次新托盘放置位置 index，绑定 put_new_tray。
      responses:
        '200':
          description: 本次单次执行的只读动作计划
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayPlanResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /device-status:
    get:
      operationId: get_device_status
      summary: 读取现场设备只读状态
      description: 回放运行期间拒绝并发诊断；不会调用运动、上电或使能命令。
      responses:
        '200':
          description: 设备状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /start:
    post:
      operationId: start_replay
      summary: 启动一次回放
      description: >-
        先全量校验先验、命名动作 JSON 和 CSV 唯一映射；录制 CSV 文件名允许使用
        01_、10_、11_ 等纯数字首段前缀，前缀只用于动作名匹配，实际执行仍使用原始文件名。
        校验通过后可能控制机械臂、AGV、夹爪、M6 和升降机构，必须现场确认安全。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRequest'
      responses:
        '202':
          description: 请求已接受并创建一次执行任务；业务拒绝统一使用 400 错误响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /stop:
    post:
      operationId: stop_replay
      summary: 停止当前回放并锁存 rapid_stop
      description: 显式停止 AGV 与已连接的左右 AR5；不停止其它设备子系统，不允许后续普通动作。
      responses:
        '200':
          description: 停止结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /reset:
    post:
      operationId: reset_replay
      summary: 人工复位服务状态
      description: 只清除 rapid_stop 状态，不自动上电、导航、恢复动作或续跑。
      responses:
        '200':
          description: 复位结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordReplayResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /prior/ball-pose:
    post:
      operationId: replace_ball_pose_prior
      summary: 替换三球 JSON 先验
      description: 仅 idle 且无活动回放线程时，校验完整 JSON 后原子替换 ball_pose_prior.json；旧文件备份到服务端 .archive。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200':
          description: 先验替换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorUploadResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /prior/charuco:
    post:
      operationId: replace_charuco_prior
      summary: 替换 ChArUco JSON 先验
      description: 仅 idle 且无活动回放线程时，校验完整 JSON 后原子替换 charuco_board_prior.json；旧文件备份到服务端 .archive。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonObject'
      responses:
        '200':
          description: 先验替换结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorUploadResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
components:
  schemas:
    RecordReplayHealthResponse:
      type: object
      additionalProperties: false
      required: [service_version, api_version, state, hardware_access]
      properties:
        service_version: {type: string}
        api_version: {type: string}
        state: {type: string, enum: [idle, busy, rapid_stop]}
        hardware_access: {type: string, enum: [lazy]}
    ReplayState:
      type: string
      enum: [idle, busy, rapid_stop]
    ReplayExecutionPhase:
      type: string
      enum: [idle, agv_navigation, preparing_devices, initializing_charuco, waiting_action_start, executing_action, updating_offset, releasing_resources, rapid_stop]
    ErrorCode:
      type: [string, 'null']
      enum:
        - invalid_request
        - invalid_index
        - invalid_plan
        - busy
        - rapid_stop
        - invalid_state
        - stop_failed
        - stop_requested
        - execution_failed
        - not_found
        - method_not_allowed
        - internal_error
        - null
    RecordReplayErrorResponse:
      type: object
      additionalProperties: false
      required: [error_code, error_text]
      properties:
        error_code:
          type: string
          enum:
            - invalid_request
            - invalid_index
            - invalid_plan
            - busy
            - rapid_stop
            - invalid_state
            - stop_failed
            - stop_requested
            - execution_failed
            - not_found
            - method_not_allowed
            - internal_error
        error_text:
          type: string
          description: 中文错误说明；未知异常包含可与服务日志关联的 request_id、异常类型和限长原因
    CsvFileStatus:
      type: object
      required: [name, row_count]
      properties:
        name: {type: string}
        row_count: {type: integer, minimum: 0}
    ExecutionTaskStatus:
      type: object
      required: [sequence, left_csv, right_csv, synchronized]
      properties:
        sequence: {type: integer, minimum: 1}
        left_csv: {type: [string, 'null']}
        right_csv: {type: [string, 'null']}
        synchronized: {type: boolean}
    PlanAction:
      type: object
      required: [sequence, csv, action_name, action_type, speed, zone, index, final_speed, settle_delay, row_count]
      properties:
        sequence: {type: integer, minimum: 1}
        csv: {type: string}
        action_name: {type: string}
        action_type: {type: string, enum: [capture, fast, precise]}
        speed: {type: number, minimum: 5}
        zone: {type: number, minimum: 0}
        index: {type: [integer, 'null'], minimum: 1}
        final_speed: {type: [number, 'null'], minimum: 5}
        settle_delay: {type: [number, 'null'], minimum: 0}
        row_count: {type: integer, minimum: 0}
    RecordReplayPlanResponse:
      type: object
      required: [state, accepted, error_code, action_sequence_sha256, old_tray_current_index, old_tray_put_index, new_tray_current_index, new_tray_put_index, left, right, error_text]
      properties:
        state: {$ref: '#/components/schemas/ReplayState'}
        accepted: {type: boolean}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        action_sequence_sha256: {type: [string, 'null']}
        old_tray_current_index: {type: [integer, 'null'], minimum: 1}
        old_tray_put_index: {type: [integer, 'null'], minimum: 1}
        new_tray_current_index: {type: [integer, 'null'], minimum: 1}
        new_tray_put_index: {type: [integer, 'null'], minimum: 1}
        left: {type: array, items: {$ref: '#/components/schemas/PlanAction'}}
        right: {type: array, items: {$ref: '#/components/schemas/PlanAction'}}
        error_text: {type: [string, 'null']}
    RuntimeParameters:
      type: object
      required: [agv_navigation_timeout_s, agv_navigation_poll_interval_s, non_motion_retry_count, non_motion_retry_delay_s]
      properties:
        agv_navigation_timeout_s: {type: number, exclusiveMinimum: 0, default: 600}
        agv_navigation_poll_interval_s: {type: number, exclusiveMinimum: 0, default: 1}
        non_motion_retry_count: {type: integer, minimum: 1, default: 3}
        non_motion_retry_delay_s: {type: number, minimum: 0, default: 0.5}
    RecordReplayResponse:
      type: object
      required: [state, execution_phase, accepted, error_code, action_sequence_sha256, left_csv_state, plan_index, error_text, left_csv_files, right_csv_files, execution_tasks, current_task_sequence, current_task_active, total_execution_count, old_tray_current_index, old_tray_put_index, new_tray_current_index, new_tray_put_index, agv_navigation_enabled, agv_target, current_left_csv, current_left_action_name, current_left_action_index, current_right_csv, current_right_action_name, current_right_action_index, current_left_row, current_right_row, current_left_total_rows, current_right_total_rows, offset_statuses, parameters]
      properties:
        state: {$ref: '#/components/schemas/ReplayState'}
        execution_phase: {$ref: '#/components/schemas/ReplayExecutionPhase'}
        accepted: {type: boolean}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        action_sequence_sha256: {type: [string, 'null']}
        left_csv_state: {type: [string, 'null']}
        plan_index: {type: [integer, 'null'], minimum: 0}
        error_text: {type: [string, 'null']}
        left_csv_files: {type: array, items: {$ref: '#/components/schemas/CsvFileStatus'}}
        right_csv_files: {type: array, items: {$ref: '#/components/schemas/CsvFileStatus'}}
        execution_tasks: {type: array, items: {$ref: '#/components/schemas/ExecutionTaskStatus'}}
        current_task_sequence: {type: integer, minimum: 0}
        current_task_active: {type: boolean}
        total_execution_count: {type: integer, minimum: 0}
        old_tray_current_index: {type: [integer, 'null'], minimum: 1}
        old_tray_put_index: {type: [integer, 'null'], minimum: 1}
        new_tray_current_index: {type: [integer, 'null'], minimum: 1}
        new_tray_put_index: {type: [integer, 'null'], minimum: 1}
        agv_navigation_enabled: {type: [boolean, 'null']}
        agv_target: {type: [string, 'null']}
        current_left_csv: {type: [string, 'null']}
        current_left_action_name: {type: [string, 'null']}
        current_left_action_index: {type: [integer, 'null'], minimum: 1}
        current_right_csv: {type: [string, 'null']}
        current_right_action_name: {type: [string, 'null']}
        current_right_action_index: {type: [integer, 'null'], minimum: 1}
        current_left_row: {type: [integer, 'null'], minimum: 1}
        current_right_row: {type: [integer, 'null'], minimum: 1}
        current_left_total_rows: {type: [integer, 'null'], minimum: 0}
        current_right_total_rows: {type: [integer, 'null'], minimum: 0}
        offset_statuses: {type: array, items: {$ref: '#/components/schemas/OffsetStatus'}}
        parameters:
          oneOf:
            - {$ref: '#/components/schemas/RuntimeParameters'}
            - type: 'null'
    OffsetStatus:
      type: object
      required: [source, available, applied]
      properties:
        source: {type: string, enum: [head, three_ball]}
        available: {type: boolean}
        applied: {type: boolean}
    ConfigChanges:
      type: object
      additionalProperties: false
      description: 允许的字段见下列 properties；boolean 和未知字段会被拒绝。
      properties:
        agv_navigation_timeout_s: {type: number}
        agv_navigation_poll_interval_s: {type: number}
        non_motion_retry_count: {type: integer}
        non_motion_retry_delay_s: {type: number}
    StartRequest:
      type: object
      additionalProperties: false
      required: [old_tray_current_index, old_tray_put_index, new_tray_current_index, new_tray_put_index, enable_agv_navigation, agv_target]
      properties:
        old_tray_current_index: {type: integer, minimum: 1}
        old_tray_put_index: {type: integer, minimum: 1}
        new_tray_current_index: {type: integer, minimum: 1}
        new_tray_put_index: {type: integer, minimum: 1}
        enable_agv_navigation: {type: boolean}
        agv_target: {type: string, minLength: 1}
    JsonObject:
      type: object
      additionalProperties: true
    PriorUploadResponse:
      type: object
      required: [accepted, file_name, backup_file]
      properties:
        accepted: {type: boolean}
        file_name: {type: string}
        backup_file: {type: [string, 'null']}
    ArmDeviceStatus:
      type: object
      required: [connected, error, ip, expected_type, robot_type, robot_uid, operate_mode, operation_state, power_state, powered_on]
      properties:
        connected: {type: boolean}
        error: {type: [string, 'null']}
        ip: {type: string}
        expected_type: {type: string}
        robot_type: {type: [string, 'null']}
        robot_uid: {type: [string, 'null']}
        operate_mode: {type: [string, 'null']}
        operation_state: {type: [string, 'null']}
        power_state: {type: [string, 'null']}
        powered_on: {type: [boolean, 'null']}
    GripperDeviceStatus:
      type: object
      required: [connected, error, online, calibrated, enabled, position, state]
      properties:
        connected: {type: boolean}
        error: {type: [string, 'null']}
        online: {type: [boolean, 'null']}
        calibrated: {type: [boolean, 'null']}
        enabled: {type: [boolean, 'null']}
        position: {type: [integer, 'null']}
        state: {type: [string, 'null']}
    HeadDeviceStatus:
      type: object
      required: [connected, error, enabled, yaw_deg, pitch_deg]
      properties:
        connected: {type: boolean}
        error: {type: [string, 'null']}
        enabled: {type: [boolean, 'null']}
        yaw_deg: {type: [number, 'null']}
        pitch_deg: {type: [number, 'null']}
    LiftDeviceStatus:
      type: object
      required: [connected, error, enabled, height_mm]
      properties:
        connected: {type: boolean}
        error: {type: [string, 'null']}
        enabled: {type: [boolean, 'null']}
        height_mm: {type: [number, 'null']}
    DeviceStatusResponse:
      type: object
      required: [all_connected, left_arm, right_arm, gripper, head, lift]
      properties:
        all_connected: {type: boolean}
        left_arm: {$ref: '#/components/schemas/ArmDeviceStatus'}
        right_arm: {$ref: '#/components/schemas/ArmDeviceStatus'}
        gripper: {$ref: '#/components/schemas/GripperDeviceStatus'}
        head: {$ref: '#/components/schemas/HeadDeviceStatus'}
        lift: {$ref: '#/components/schemas/LiftDeviceStatus'}
  responses:
    ErrorResponse:
      description: 请求或业务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecordReplayErrorResponse'
